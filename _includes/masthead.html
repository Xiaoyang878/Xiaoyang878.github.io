<header class="site-header">

    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="nav-links" hidden>Menu <span aria-hidden="true">☰</span></button>

      {% for link in site.data.navigation.main %}

      {% endfor %}
    </ul>
  </nav>
</header>
