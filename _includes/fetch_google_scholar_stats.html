<script>
(() => {
  const total = document.getElementById('total_cit');
  const papers = document.querySelectorAll('.show_paper_citations');
  if (!total && !papers.length) return;
  {% if site.google_scholar_stats_use_cdn %}
  const url = 'https://cdn.jsdelivr.net/gh/{{ site.repository }}@google-scholar-stats/gs_data.json';
  {% else %}
  const url = 'https://raw.githubusercontent.com/{{ site.repository }}/google-scholar-stats/gs_data.json';
  {% endif %}
  fetch(url).then(response => {
    if (!response.ok) throw new Error('Citation data unavailable');
    return response.json();
  }).then(data => {
    if (total && typeof data.citedby === 'number') total.textContent = data.citedby;
    papers.forEach(element => {
      const paper = (data.publications || {})[element.getAttribute('data')];
      if (paper && typeof paper.num_citations === 'number') element.textContent = '| Citations: ' + paper.num_citations;
    });
  }).catch(() => { /* Optional statistics must not affect the page. */ });
})();
</script>
